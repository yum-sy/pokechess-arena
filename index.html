		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":0,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":28186076,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>

html,body { width:100%;height:100%;overflow:hidden;background:#102f56;overscroll-behavior:none;-webkit-user-select:none;user-select:none; }
#safe-game-area { position:fixed;box-sizing:border-box;left:0;top:0;width:100%;height:100%;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);pointer-events:none; }

input,textarea,[contenteditable="true"] { -webkit-user-select:text;user-select:text;-webkit-touch-callout:default; }
button { touch-action:manipulation; }
#rotate-device { position:fixed;inset:0;z-index:20000;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;background:#102f56;color:#fff9e9;text-align:center;font:600 20px/1.6 sans-serif;padding:32px;touch-action:none; }
#rotate-device[hidden] { display:none; }

</style>
<div id="safe-game-area" aria-hidden="true"></div>
<div id="rotate-device" role="dialog" aria-modal="true" aria-label="가로 화면 안내" hidden><strong>기기를 가로로 돌려 주세요</strong><span>포켓몬과 전장을 넓게 보며 플레이하세요.<br>진행 중인 경기는 계속됩니다.</span></div>
<button id="game-fullscreen" type="button" hidden aria-label="게임 전체 화면">전체 화면</button>
<script>
(() => {
  const canvas=document.getElementById('canvas'), safe=document.getElementById('safe-game-area');
  // Block browser image dragging/callouts only on the play surface; text fields retain editing.
  canvas.addEventListener('contextmenu',e=>e.preventDefault());
  canvas.addEventListener('dragstart',e=>e.preventDefault());
  const overlay=document.getElementById('rotate-device'), fullscreen=document.getElementById('game-fullscreen');
  let blocked=false;
  function fit() {
    const viewport=window.visualViewport;
    const width=viewport?.width || window.innerWidth, height=viewport?.height || window.innerHeight;
    const left=viewport?.offsetLeft || 0, top=viewport?.offsetTop || 0;
    Object.assign(safe.style,{left:left+'px',top:top+'px',width:width+'px',height:height+'px'});
    const css=getComputedStyle(safe), inset=['Left','Right','Top','Bottom'].map(side=>parseFloat(css['padding'+side])||0);
    const w=Math.max(1,width-inset[0]-inset[1]), h=Math.max(1,height-inset[2]-inset[3]);
    Object.assign(canvas.style,{left:(left+inset[0])+'px',top:(top+inset[2])+'px',width:w+'px',height:h+'px'});
    const ratio=window.devicePixelRatio || 1;
    const pixelsW=Math.round(w*ratio),pixelsH=Math.round(h*ratio);
    if(canvas.width!==pixelsW)canvas.width=pixelsW;
    if(canvas.height!==pixelsH)canvas.height=pixelsH;
    // Use the layout viewport: the software keyboard must not masquerade as a device rotation.
    blocked=window.innerHeight>window.innerWidth;
    overlay.hidden=!blocked;canvas.inert=blocked;
    if(blocked && document.activeElement===canvas)canvas.blur();
    const appMode=window.PCAInstall?.isAppMode() || window.navigator?.standalone || (window.matchMedia && (window.matchMedia('(display-mode: standalone)').matches || window.matchMedia('(display-mode: fullscreen)').matches));
    fullscreen.hidden=appMode || blocked || canvas.dataset.playing==='true' || !document.fullscreenEnabled || !!document.fullscreenElement;
  }
  for(const event of ['pointerdown','pointerup','pointermove','touchstart','touchmove','touchend','mousedown','mouseup','click','wheel','keydown','keyup']) {
    window.addEventListener(event,(e)=>{if(blocked){e.preventDefault();e.stopImmediatePropagation();}}, {capture:true,passive:false});
  }
  fullscreen.addEventListener('click',async()=>{
    try { await document.documentElement.requestFullscreen(); } catch (_) { fullscreen.textContent='전체 화면을 사용할 수 없어요'; }
    fit();
  });
  window.addEventListener('resize',fit);window.addEventListener('orientationchange',fit);
  document.addEventListener('fullscreenchange',fit);
  window.visualViewport?.addEventListener('resize',fit);window.visualViewport?.addEventListener('scroll',fit);
  new MutationObserver(fit).observe(canvas,{attributes:true,attributeFilter:['data-playing']});
  fit();
})();
</script>

<script>
// Updates never replace a running match; apply only from the lobby.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.ready.then((registration) => {
    let notice;
    const canvas=document.getElementById('canvas');
    const render=()=>{
      if(!notice)return;
      const playing=canvas.dataset.playing==='true';
      notice.disabled=playing;notice.hidden=playing;
      notice.textContent=playing?'새 버전 준비됨 · 로비에서 적용':'새 버전 적용';
      notice.style.opacity=playing?'.75':'1';
    };
    const show = () => {
      if (!registration.waiting || notice) return;
      notice = document.createElement('button');notice.id='app-update-notice';
      notice.style.cssText = 'position:fixed;top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));z-index:10000;min-height:44px;padding:10px 14px;border:2px solid #81745b;border-top-color:#e4ca78;background:#171c30;color:#f4ecd9;font:14px sans-serif;cursor:pointer';
      notice.addEventListener('click', () => {if(canvas.dataset.playing!=='true')registration.waiting?.postMessage('update');});
      document.body.appendChild(notice);render();
    };
    new MutationObserver(render).observe(canvas,{attributes:true,attributeFilter:['data-playing']});
    show();
    registration.addEventListener('updatefound', () => {
      const installing = registration.installing;
      installing?.addEventListener('statechange', () => { if (installing.state === 'installed') show(); });
    });
  }).catch(() => {});
}
</script>

<style>
#app-install { position:fixed;left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));z-index:10002;box-sizing:border-box;width:min(520px,calc(100% - 150px - env(safe-area-inset-left) - env(safe-area-inset-right)));padding:12px 14px;background:#171c30f5;border:2px solid #81745b;border-top:4px solid #e4ca78;box-shadow:4px 4px 0 #06121cb3;color:#fff9e9;font:16px/1.5 sans-serif; }
#app-install[hidden] { display:none; }
#app-install strong { display:block;color:#ffe16b;font-size:18px; }
#app-install p { margin:4px 0 8px;word-break:keep-all;overflow-wrap:anywhere;white-space:pre-line; }

#app-install button { min-height:44px;min-width:88px;padding:7px 14px;border:2px solid #8aaba9;background:#355c65;color:#fff9e9;font:600 15px sans-serif;cursor:pointer; }
#app-install button:first-child { background:#d15c50;border-color:#efad82; }
#app-install button:focus-visible { outline:3px solid #ffe16b;outline-offset:2px; }
@media(max-height:380px) { #app-install { padding:8px 12px; } #app-install p { margin:2px 0 6px; } }
</style>
<aside id="app-install" aria-label="앱 설치 안내" hidden>
<strong>모바일에서는 앱 설치를 권장해요</strong>
<p id="app-install-copy">주소창 없이 넓게 플레이하세요. 모바일 PvP는 홈 화면의 앱으로 실행해야 해요.</p>
<div class="actions"><button id="app-install-action" type="button">설치 방법</button><button id="app-install-later" type="button">나중에</button></div>
</aside>
<script>
(() => {
  const panel=document.getElementById('app-install'), action=document.getElementById('app-install-action');
  const copy=document.getElementById('app-install-copy'), later=document.getElementById('app-install-later');
  const canvas=document.getElementById('canvas');
  const mode=matchMedia('(display-mode: standalone)'), fullMode=matchMedia('(display-mode: fullscreen)');
  const ios=/iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
  const mobile=ios || /Android/.test(navigator.userAgent);
  let pending=null, dismissed=false, busy=false, explicit=false, installedNotice=false, openedDuringGame=false;
  try { dismissed=Date.now()<Number(localStorage.getItem('pca-install-dismissed-until')||0); } catch (_) {}
  // Browser requestFullscreen is not an installed launch. Some engines report
  // display-mode:fullscreen for that API too, so exclude a fullscreenElement.
  const launchedAsApp=mode.matches || !!navigator.standalone || (fullMode.matches && !document.fullscreenElement);
  function appMode() { return launchedAsApp || mode.matches || !!navigator.standalone || (fullMode.matches && !document.fullscreenElement); }
  function needsInstall() { return mobile && !appMode(); }
  function render() {
    panel.hidden=!needsInstall() || innerHeight>innerWidth || (!explicit && (dismissed || !!document.fullscreenElement || canvas.dataset.playing==='true'));
    action.textContent=installedNotice?'실행 방법':pending?'앱 설치':'설치 방법';action.disabled=busy;action.hidden=explicit && !pending && !busy;
    later.textContent=explicit?'닫기':'나중에';
  }
  function dismiss() {
    explicit=false;dismissed=true;
    try { localStorage.setItem('pca-install-dismissed-until',String(Date.now()+7*86400000)); } catch (_) {}
    render();
  }
  function manual() {
    copy.textContent=installedNotice?'설치한 홈 화면 아이콘으로 게임을 다시 열어 주세요. 현재 브라우저 창은 앱 실행 모드가 아니에요.':ios?'공유 → 홈 화면에 추가를 선택하세요.\n‘웹 앱으로 열기’가 있으면 켜 주세요.':'메뉴에서 앱 설치 또는 홈 화면에 추가를 선택하세요.';
  }
  async function open() {
    if(!needsInstall() || busy)return;
    explicit=true;openedDuringGame=canvas.dataset.playing==='true';render();
    if(pending) {
      const request=pending;pending=null;busy=true;render();
      try {
        await request.prompt();const choice=await request.userChoice;
        if(choice.outcome==='accepted'){installedNotice=true;manual();}
        else dismiss();
      } catch (_) { manual(); }
      finally { busy=false;render(); }
    } else { manual();render(); }
  }
  // The game calls open directly from a user's settings/queue button gesture.
  window.PCAInstall={needsInstall,open,isMobile:()=>mobile,isAppMode:appMode};
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();pending=e;render();});
  window.addEventListener('appinstalled',()=>{installedNotice=true;pending=null;manual();render();});
  action.addEventListener('click',open);
  later.addEventListener('click',dismiss);
  for(const e of ['resize','orientationchange'])window.addEventListener(e,render);
  document.addEventListener('fullscreenchange',render);
  mode.addEventListener('change',render);fullMode.addEventListener('change',render);
  new MutationObserver(()=>{if(canvas.dataset.playing==='true' && !openedDuringGame)explicit=false;render();}).observe(canvas,{attributes:true,attributeFilter:['data-playing']});
  render();
})();
</script>
